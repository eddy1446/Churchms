[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Eddy <eddy1446@users.noreply.github.com>"]
repository = "https://github.com/eddy1446/Churchms"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
